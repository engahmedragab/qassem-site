<style>
.jg{min-height:100vh;display:grid;place-items:center;padding:28px 20px;background:#0F1B2D;color:#F7F3EC;font-family:'IBM Plex Sans Arabic',-apple-system,Arial,sans-serif;position:relative;overflow:hidden}
.jg::before{content:"";position:absolute;inset:-30% -10% auto;height:70%;background:radial-gradient(closest-side,rgba(245,163,26,.20),transparent);pointer-events:none}
.jg *{box-sizing:border-box}
.jg-in{position:relative;width:min(1040px,100%);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,64px);align-items:center}
@media(max-width:860px){.jg-in{grid-template-columns:1fr}.jg-wall{order:2}}
.jg-wall{background:linear-gradient(160deg,#3A2F28,#241D19);border-radius:22px;padding:clamp(18px,3.5vw,34px);box-shadow:0 30px 70px rgba(0,0,0,.45)}
.jg-frame{background:#0A111D;border-radius:18px;padding:11px 11px 32px;position:relative}
.jg-scr{aspect-ratio:16/9;border-radius:8px;background:#F7F3EC;color:#0F1B2D;display:flex;align-items:center;gap:16px;padding:clamp(14px,3vw,26px);overflow:hidden}
.jg-scr .tx{flex:1;min-width:0}
.jg-scr .k{font-size:clamp(11px,1.5vw,13px);color:#5F6875;font-weight:600}
.jg-scr .h{font-weight:700;font-size:clamp(19px,3.2vw,30px);line-height:1.45}
.jg-scr .h em{font-style:normal;color:#C47E06}
.jg-scr .s{color:#5F6875;font-size:clamp(11px,1.5vw,14px);margin-top:4px}
.jg-qr{width:clamp(64px,12vw,100px);height:auto;flex:none;display:block}
.jg-badge{position:absolute;inset-inline:0;bottom:8px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:11px;letter-spacing:.24em;direction:ltr;color:#F7F3EC}
@keyframes jgglow{0%,100%{box-shadow:0 0 0 0 rgba(245,163,26,0)}50%{box-shadow:0 0 40px 2px rgba(245,163,26,.22)}}
.jg-frame{animation:jgglow 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.jg-frame{animation:none}}
.jg-side{display:grid;gap:22px}
.jg-brand{display:flex;align-items:center;gap:12px}
.jg-brand b{font-size:32px;font-weight:700;line-height:1.3}
.jg-brand small{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.3em;color:#8794A6;direction:ltr}
.jg form{background:#18283F;border:1px solid #2B3D57;border-radius:20px;padding:24px;display:grid;gap:14px}
.jg h1{font-size:21px;font-weight:700;margin:0}
.jg p{margin:0;color:#B3BCC9;font-size:14.5px;line-height:1.75}
.jg label{display:grid;gap:6px;font-size:13.5px;color:#B3BCC9}
.jg input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid #2B3D57;background:#0F1B2D;color:#F7F3EC;direction:ltr;text-align:left}
.jg input:focus{outline:2px solid #F5A31A;outline-offset:1px;border-color:transparent}
.jg button{font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:12px;background:#F5A31A;color:#0F1B2D;cursor:pointer}
.jg button:hover{background:#FFB43A}
.jg button[disabled]{opacity:.6;cursor:wait}
.jg .er{color:#FF9A85;font-size:14px;min-height:20px}
.jg-sw{display:flex;gap:6px}.jg-sw i{width:22px;height:8px;border-radius:99px}
.jg-foot{display:flex;justify-content:space-between;gap:10px;font:500 11.5px 'IBM Plex Mono',monospace;color:#8794A6;direction:ltr}
.jg-foot a{color:inherit;text-decoration:none}
</style>
